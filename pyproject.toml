[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "island"
dynamic = ["version"]
description = "island generic source manager (like repo in simple mode)"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "Edouard DUPIN", email = "yui.heero@gmail.com" }]
keywords = ["source", "manager", "repo", "qisrc", "lutin"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["lxml", "realog", "death", "PyYAML"]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "lxml-stubs", "types-PyYAML"]

[project.scripts]
island = "island.bin_island:main"

[project.urls]
Homepage = "http://github.com/HeeroYui/island"
"Bug Reports" = "http://github.com/HeeroYui/island/issues"
Source = "http://github.com/HeeroYui/island"

[tool.setuptools.packages.find]
include = ["island*"]

[tool.setuptools.dynamic]
version = { file = "version.txt" }

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["island"]
force-sort-within-sections = true
lines-after-imports = 2
