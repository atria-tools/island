[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "island"
dynamic = ["version"]
description = "island generic source manager (like repo in simple mode)"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "Edouard DUPIN", email = "yui.heero@gmail.com" }]
keywords = ["source", "manager", "repo", "qisrc", "lutin"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["lxml", "realog", "death", "PyYAML"]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "lxml-stubs", "types-PyYAML"]

[project.scripts]
island = "island.bin_island:main"

[project.urls]
Homepage = "http://github.com/HeeroYui/island"
"Bug Reports" = "http://github.com/HeeroYui/island/issues"
Source = "http://github.com/HeeroYui/island"

[tool.setuptools.packages.find]
include = ["island*"]

[tool.setuptools.dynamic]
version = { file = "version.txt" }

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "PIE", "PERF", "RUF", "A", "N", "EXE"]
ignore = [
    "E501", # the formatter sets the length of the lines; it does not cut the long messages
    "N813", # the modules of death are named in CamelCase, island imports them in lower case
]

[tool.ruff.lint.per-file-ignores]
# the file of an action is named after it (sync-local), and 'help' is the function the action loader asks it for
"island/actions/islandAction_*.py" = ["A001", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["island"]
force-sort-within-sections = true
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["island", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# the libraries of the same author, without type information
module = ["realog", "realog.*", "death", "death.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# the modules fully annotated, the others join them one by one
module = ["island.env", "island.tools", "island.multiprocess", "island.repo_config", "island.commands", "island.config", "island.manifest"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
